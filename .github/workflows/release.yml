name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise trust

      - name: Determine release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            current=$(awk '$1 == "version:" { print $2 }' apm.yml)
            IFS=. read -r major minor patch <<< "$current"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "unknown bump: $BUMP" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            version="${REF#v}"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Bump apm.yml version
        if: steps.version.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" apm.yml

      - name: Verify tag matches apm.yml version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(awk '$1 == "version:" { print $2 }' apm.yml)
          if [ "v${version}" != "${TAG}" ]; then
            echo "apm.yml version v${version} does not match ${TAG}" >&2
            exit 1
          fi

      - name: Audit skills
        run: mise run skills -- audit

      - name: Pack APM bundle
        run: apm pack

      - name: Archive bundle
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tar -czf "kerpo-skills-${TAG}.tar.gz" -C build "kerpo-skills-${VERSION}"

      - name: Commit version bump
        if: steps.version.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apm.yml apm.lock.yaml
          if git diff --cached --quiet; then
            echo "no version change to commit" >&2
            exit 1
          fi
          git commit -m "Release ${VERSION}"

      - name: Tag and push
        if: steps.version.outputs.bump == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git tag "${TAG}"
          git push origin "HEAD:${REF_NAME}" "${TAG}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" "kerpo-skills-${TAG}.tar.gz" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
