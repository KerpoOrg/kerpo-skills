name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.8.0); must already exist
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Pack and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise trust
      - name: Audit skills
        run: mise run skills -- audit
      - name: Verify tag matches apm.yml version
        run: |
          set -euo pipefail
          version=$(awk '$1 == "version:" { print $2 }' apm.yml)
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "apm.yml version v${version} does not match tag ${RELEASE_TAG}" >&2
            exit 1
          fi
      - name: Pack APM bundle
        run: apm pack
      - name: Archive bundle
        run: tar -czf "kerpo-skills-${RELEASE_TAG}.tar.gz" -C build "kerpo-skills-${RELEASE_TAG#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" "kerpo-skills-${RELEASE_TAG}.tar.gz" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag
