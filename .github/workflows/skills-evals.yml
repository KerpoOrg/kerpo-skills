name: Skill evals

# Trigger-accuracy (and, opt-in, output-quality) evals against a free OpenCode
# model. Kept out of the PR quality gates: free-model latency and near-miss
# noise make it a poor required check. Run nightly, or on demand.
#
# Auth: OPENCODE_API_KEY (repo/org secret). Free Zen models also work without
# it, at the cost of anonymous rate limits.
# Optional repo variables: EVAL_MODEL, EVAL_TIMEOUT (empty = harness default).

on:
  workflow_dispatch:
    inputs:
      run_evals:
        description: Also run output-quality evals (slow)
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: skills-evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triggers:
    name: Trigger and output evals
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      EVAL_MODEL: ${{ vars.EVAL_MODEL }}
      EVAL_TIMEOUT: ${{ vars.EVAL_TIMEOUT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise trust

      - name: Trigger-accuracy evals (all skills)
        run: |
          set -euo pipefail
          if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
            unset OPENCODE_API_KEY
            echo "OPENCODE_API_KEY not set; using anonymous free-model access"
          fi
          mise run skills -- triggers

      - name: Output-quality evals (all skills)
        if: ${{ inputs.run_evals }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
            unset OPENCODE_API_KEY
          fi
          mise run skills -- evals

      - name: Run summary
        if: always()
        run: |
          set -euo pipefail
          ./scripts/summarize-triggers.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-eval-results
          path: |
            **/evals/trigger-results.json
            **/*-workspace/**
          if-no-files-found: ignore
          retention-days: 14
