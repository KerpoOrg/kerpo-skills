# Node/npm CI starter (kerpo baseline).
# Third-party actions are pinned to full commit SHAs. Keep the pins; let
# Dependabot (`package-ecosystem: github-actions`) or Renovate
# (`helpers:pinGitHubActionDigestsToSemver`) refresh them.
# Optimization defaults (see gha-perf-playbook): concurrency cancel on PR,
# lockfile cache, timeout. For monorepos or multi-job pipelines: build once
# per SHA → upload-artifact → reuse; keep draft/push change-scoped and deepen
# when ready for review / merge_group.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
